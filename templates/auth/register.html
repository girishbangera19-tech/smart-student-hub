{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block body %}
<div class="auth-wrap">
  <div class="auth-card auth-card-wide">
    <a href="{{ url_for('dashboard.landing') }}" class="brand justify-content-center mb-4">
      <span class="brand-mark"><i class="bi bi-mortarboard-fill"></i></span><span>Smart Student Hub</span>
    </a>
    <h1 class="auth-title">Create your account</h1>
    <p class="auth-sub">Set up your student profile in under a minute.</p>

    <form method="post" novalidate data-loading-form>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label" for="full_name">Full name</label>
          <input class="form-control" id="full_name" name="full_name" value="{{ form.get('full_name', '') }}" required autocomplete="name">
        </div>
        <div class="col-md-6">
          <label class="form-label" for="email">Email</label>
          <input class="form-control" type="email" id="email" name="email" value="{{ form.get('email', '') }}" required autocomplete="email">
        </div>
        <div class="col-md-6">
          <label class="form-label" for="password">Password</label>
          <input class="form-control" type="password" id="password" name="password" minlength="8" required autocomplete="new-password">
          <div class="form-text">At least 8 characters.</div>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="confirm_password">Confirm password</label>
          <input class="form-control" type="password" id="confirm_password" name="confirm_password" required autocomplete="new-password">
        </div>
        <div class="col-12">
          <label class="form-label" for="college_name">College name</label>
          <input class="form-control" id="college_name" name="college_name" value="{{ form.get('college_name', '') }}" required>
        </div>
        <div class="col-md-6">
          <label class="form-label" for="branch">Branch</label>
          <select class="form-select" id="branch" name="branch" required>
            <option value="">Choose…</option>
            {% for b in branches %}
              <option value="{{ b }}" {% if form.get('branch') == b %}selected{% endif %}>{{ b }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label" for="semester">Semester</label>
          <select class="form-select" id="semester" name="semester" required>
            <option value="">–</option>
            {% for s in range(1, 9) %}
              <option value="{{ s }}" {% if form.get('semester') == s|string %}selected{% endif %}>{{ s }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label" for="scheme">Scheme</label>
          <select class="form-select" id="scheme" name="scheme">
            <option value="">Optional</option>
            {% for s in schemes %}
              <option value="{{ s }}" {% if form.get('scheme') == s %}selected{% endif %}>{{ s }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <button class="btn btn-primary w-100 mt-4" type="submit">Create account</button>
    </form>
    <p class="auth-foot">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p>
  </div>
</div>
{% endblock %}
