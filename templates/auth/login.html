{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block body %}
<div class="auth-wrap">
  <div class="auth-card">
    <a href="{{ url_for('dashboard.landing') }}" class="brand justify-content-center mb-4">
      <span class="brand-mark"><i class="bi bi-mortarboard-fill"></i></span><span>Smart Student Hub</span>
    </a>
    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-sub">Log in to see your classes, exams and deadlines.</p>

    <form method="post" novalidate data-loading-form>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input class="form-control" type="email" id="email" name="email" value="{{ email }}" required autofocus autocomplete="email">
      </div>
      <div class="mb-4">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <button class="btn btn-primary w-100" type="submit">Log in</button>
    </form>
    <p class="auth-foot">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
  </div>
</div>
{% endblock %}
